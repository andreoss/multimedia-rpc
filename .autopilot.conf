# Autopilot configuration for multimedia-rpc.
# The gate is this repository's own: format, clippy, buf lint and breaking,
# the full workspace suite, and line coverage at or above 85 percent.
AUTOPILOT_GATE=scripts/gate.sh

# Commits in this repository are one concise imperative sentence with no
# conventional-commit prefix, so the generic subject pattern does not apply:
# this accepts a capitalised sentence and refuses a conventional-commit type.
AUTOPILOT_SUBJECT_PATTERN='^[A-Z][a-z]'

# An id is done when its status reaches x.
AUTOPILOT_PROGRESS_SYMBOLS=x

# The plan, the process and the tracker bind the agent; the brief is
# doc/agent.md and it wins over the generic rules.
AUTOPILOT_BRIEF=doc/agent.md