syntax = "proto3";

package mmrpc.v1;

import "mmrpc/v1/media.proto";

message ConcatSpec {
  repeated MediaRef inputs = 1;
  OutputProfile profile = 2;
}

message ProbeSpec {
  MediaRef input = 1;
}

message TranscodeSpec {
  MediaRef input = 1;
  OutputProfile profile = 2;
}

message TrimSpec {
  MediaRef input = 1;
  double start_seconds = 2;
  double duration_seconds = 3;
}

message ThumbnailSpec {
  MediaRef input = 1;
  repeated double offsets_seconds = 2;
  uint32 width = 3;
  uint32 height = 4;
}

enum ImageOp {
  IMAGE_OP_UNSPECIFIED = 0;
  IMAGE_OP_RESIZE = 1;
  IMAGE_OP_CONVERT = 2;
  IMAGE_OP_COMPOSITE = 3;
}

enum ImageFormat {
  IMAGE_FORMAT_UNSPECIFIED = 0;
  IMAGE_FORMAT_JPEG = 1;
  IMAGE_FORMAT_PNG = 2;
}

enum ResizeMode {
  RESIZE_MODE_UNSPECIFIED = 0;
  RESIZE_MODE_FIT = 1;
  RESIZE_MODE_EXACT = 2;
  RESIZE_MODE_FILL = 3;
}

message ImageSpec {
  repeated MediaRef inputs = 1;
  ImageOp op = 2;
  uint32 width = 3;
  uint32 height = 4;
  ResizeMode resize_mode = 5;
  ImageFormat format = 6;
}

message PackageSpec {
  MediaRef input = 1;
  double segment_seconds = 2;
}

message OpSpec {
  oneof op {
    ConcatSpec concat = 1;
    ProbeSpec probe = 2;
    TranscodeSpec transcode = 3;
    TrimSpec trim = 4;
    ThumbnailSpec thumbnail = 5;
    ImageSpec image = 6;
    PackageSpec package = 7;
  }
}

message ConcatResult {
  MediaRef output = 1;
  double duration_seconds = 2;
}

message ProbeResult {
  double duration_seconds = 1;
  uint32 video_streams = 2;
  uint32 audio_streams = 3;
  string container = 4;
}

message TranscodeResult {
  MediaRef output = 1;
}

message TrimResult {
  MediaRef output = 1;
  double duration_seconds = 2;
}

message ThumbnailResult {
  repeated MediaRef outputs = 1;
}

message ImageResult {
  repeated MediaRef outputs = 1;
}

message PackageResult {
  MediaRef playlist = 1;
  repeated MediaRef segments = 2;
}

message OpResult {
  oneof op {
    ConcatResult concat = 1;
    ProbeResult probe = 2;
    TranscodeResult transcode = 3;
    TrimResult trim = 4;
    ThumbnailResult thumbnail = 5;
    ImageResult image = 6;
    PackageResult package = 7;
  }
}
