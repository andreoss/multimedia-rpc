syntax = "proto3";

package mmrpc.v1;

message MediaRef {
  oneof ref {
    string object_uri = 1;
    string http_url = 2;
  }
}

message OutputProfile {
  double frame_rate = 1;
  uint32 video_max_bitrate = 2;
  uint32 video_quality = 3;
  uint32 audio_bitrate = 4;
  uint32 audio_sample_rate = 5;
  uint32 width = 6;
  uint32 height = 7;
}

message FileError {
  MediaRef media_ref = 1;
  string code = 2;
  optional uint32 step_index = 3;
  optional string node_id = 4;
  optional uint32 input_index = 5;
}

message InputFailureList {
  repeated FileError failures = 1;
}

message Callback {
  string queue_url = 1;
}
