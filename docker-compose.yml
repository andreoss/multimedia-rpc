services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm
      POSTGRES_DB: mm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d mm"]
      interval: 5s
      timeout: 3s
      retries: 12

  objectstore:
    image: minio/minio:latest
    command: ["server", "/data"]
    environment:
      MINIO_ROOT_USER: mmadmin
      MINIO_ROOT_PASSWORD: mmsecret1
    ports:
      - "127.0.0.1:9000:9000"
    volumes:
      - store-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
  store-data:
