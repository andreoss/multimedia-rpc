syntax = "proto3";

package mmrpc.v1;

import "mmrpc/v1/job.proto";
import "mmrpc/v1/media.proto";
import "mmrpc/v1/ops.proto";

service MediaJobService {
  rpc CreateJob(CreateJobRequest) returns (CreateJobResponse);
  rpc GetJob(GetJobRequest) returns (GetJobResponse);
  rpc CancelJob(CancelJobRequest) returns (CancelJobResponse);
  rpc ListJobs(ListJobsRequest) returns (ListJobsResponse);
  rpc WatchJob(WatchJobRequest) returns (stream WatchJobResponse);
}

message CreateJobRequest {
  string user_id = 1;
  string idempotency_key = 2;
  OpSpec spec = 3;
  Callback callback = 4;
}

message CreateJobResponse {
  string job_id = 1;
  string request_id = 2;
  bool created = 3;
}

message GetJobRequest {
  string user_id = 1;
  string job_id = 2;
}

message GetJobResponse {
  Job job = 1;
}

message CancelJobRequest {
  string user_id = 1;
  string job_id = 2;
}

message CancelJobResponse {
  Job job = 1;
}

message ListJobsRequest {
  string user_id = 1;
  repeated JobState statuses = 2;
  uint32 page_size = 3;
  string page_token = 4;
}

message ListJobsResponse {
  repeated Job jobs = 1;
  string next_page_token = 2;
}

message WatchJobRequest {
  string user_id = 1;
  string job_id = 2;
}

message WatchJobResponse {
  JobEvent event = 1;
}
