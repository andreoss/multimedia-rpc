syntax = "proto3";

package mmrpc.v1;

message MediaRef {
  oneof ref {
    string object_uri = 1;
    string http_url = 2;
  }
}

message TrimRange {
  double start_seconds = 1;
  double duration_seconds = 2;
}

message MediaSource {
  MediaRef media = 1;
  TrimRange trim = 2;
  optional double speed = 3;
  optional double volume = 4;
}

message NodeRef {
  string id = 1;
  uint32 output = 2;
}

message ParameterRef {
  string name = 1;
}

message InputSource {
  oneof source {
    MediaSource media = 1;
    NodeRef node = 2;
    ParameterRef parameter = 3;
  }
}

message OutputRange {
  double start_seconds = 1;
  double duration_seconds = 2;
}

message OutputProfile {
  double frame_rate = 1;
  uint32 video_max_bitrate = 2;
  uint32 video_quality = 3;
  uint32 audio_bitrate = 4;
  uint32 audio_sample_rate = 5;
  uint32 width = 6;
  uint32 height = 7;
  optional double poster_seconds = 8;
  OutputRange range = 9;
}

message FileError {
  MediaRef media_ref = 1;
  string code = 2;
  optional uint32 step_index = 3;
  optional string node_id = 4;
  optional uint32 input_index = 5;
  optional uint32 rung = 6;
}

message InputFailureList {
  repeated FileError failures = 1;
}

message Callback {
  string queue_url = 1;
}
