[workspace]
resolver = "3"
members = [
    "crates/mm-domain",
    "crates/mm-proto",
    "crates/mm-ffmpeg",
    "crates/mm-storage",
    "crates/mm-jobstore",
    "crates/mm-server",
    "crates/mm-worker",
    "crates/mmrpcd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
proptest = "1"
