stages:
  - lint
  - test

image: rust:1.97

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

cache:
  key: cargo
  paths:
    - .cargo
    - target

fmt:
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

clippy:
  stage: lint
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

proto-lint:
  stage: lint
  image:
    name: bufbuild/buf:1.72.0
    entrypoint: [""]
  cache: []
  script:
    - buf lint

proto-breaking:
  stage: lint
  image:
    name: bufbuild/buf:1.72.0
    entrypoint: [""]
  cache: []
  script:
    - buf breaking --against "$CI_REPOSITORY_URL#branch=$CI_DEFAULT_BRANCH"
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

.objectstore-service: &objectstore-service
  name: chrislusf/seaweedfs:latest
  alias: objectstore
  entrypoint: ["sh", "-c"]
  command:
    - >
      mkdir -p /etc/objectstore &&
      printf '%s' '{"identities":[{"name":"mm","credentials":[{"accessKey":"mm-test-access","secretKey":"mm-test-secret"}],"actions":["Admin","Read","Write","List","Tagging"]}]}'
      > /etc/objectstore/s3.json &&
      exec /entrypoint.sh server -s3 -s3.config=/etc/objectstore/s3.json -dir=/data

.db-service: &db-service
  name: postgres:16
  alias: db

.stack-variables: &stack-variables
  MM_OBJECTSTORE_ENDPOINT: http://objectstore:8333
  MM_DATABASE_URL: postgres://mm:mm@db:5432/mm
  POSTGRES_USER: mm
  POSTGRES_PASSWORD: mm
  POSTGRES_DB: mm

test:
  stage: test
  services:
    - *objectstore-service
    - *db-service
  variables: *stack-variables
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
  script:
    - cargo test --workspace --no-fail-fast

coverage:
  stage: test
  services:
    - *objectstore-service
    - *db-service
  variables: *stack-variables
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
  script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked
    - cargo llvm-cov --workspace --no-fail-fast --fail-under-lines 85
