[package]
name = "mm-server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[dependencies]
mm-auth = { path = "../mm-auth" }
mm-domain = { path = "../mm-domain" }
mm-ffmpeg = { path = "../mm-ffmpeg" }
mm-observability = { path = "../mm-observability" }
mm-proto = { path = "../mm-proto" }
base64.workspace = true
thiserror.workspace = true
tokio = { workspace = true, features = ["macros", "net", "rt", "sync", "time"] }
tokio-stream = { workspace = true, features = ["net"] }
tonic.workspace = true
tonic-health.workspace = true

[dev-dependencies]
async-trait.workspace = true
futures-util.workspace = true
mm-auth = { path = "../mm-auth", features = ["testing"] }
mm-jobstore = { path = "../mm-jobstore" }
mm-storage = { path = "../mm-storage" }
mm-testkit = { path = "../mm-testkit" }
sqlx.workspace = true
tokio = { workspace = true, features = ["macros", "rt-multi-thread"] }
uuid.workspace = true
