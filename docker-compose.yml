services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm
      POSTGRES_DB: mm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d mm"]
      interval: 5s
      timeout: 3s
      retries: 12

  objectstore:
    image: chrislusf/seaweedfs:latest
    command:
      [
        "server",
        "-s3",
        "-s3.config=/etc/objectstore/s3.json",
        "-dir=/data",
        "-master.volumeSizeLimitMB=256",
        "-volume.max=64",
        "-volume.minFreeSpacePercent=0",
      ]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - store-data:/data
      - ./compose/objectstore-s3.json:/etc/objectstore/s3.json:ro
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:9333/cluster/healthz"]
      interval: 5s
      timeout: 3s
      retries: 12

  queue:
    image: softwaremill/elasticmq-native:latest
    ports:
      - "127.0.0.1:9324:9324"
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:9324/?Action=ListQueues || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
  store-data:
