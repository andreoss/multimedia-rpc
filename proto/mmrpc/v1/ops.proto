syntax = "proto3";

package mmrpc.v1;

import "mmrpc/v1/media.proto";

message ConcatSpec {
  repeated InputSource inputs = 1;
  OutputProfile profile = 2;
}

message ProbeSpec {
  InputSource input = 1;
}

message TranscodeSpec {
  InputSource input = 1;
  OutputProfile profile = 2;
}

message TrimSpec {
  InputSource input = 1;
  double start_seconds = 2;
  double duration_seconds = 3;
}

message ThumbnailSpec {
  InputSource input = 1;
  repeated double offsets_seconds = 2;
  uint32 width = 3;
  uint32 height = 4;
  uint32 sprite_columns = 5;
}

enum SubtitleMode {
  SUBTITLE_MODE_UNSPECIFIED = 0;
  SUBTITLE_MODE_BURN = 1;
  SUBTITLE_MODE_MUX = 2;
  SUBTITLE_MODE_STRIP = 3;
}

enum CaptionFormat {
  CAPTION_FORMAT_UNSPECIFIED = 0;
  CAPTION_FORMAT_SRT = 1;
  CAPTION_FORMAT_WEBVTT = 2;
  CAPTION_FORMAT_SCC = 3;
  CAPTION_FORMAT_EMBEDDED = 4;
}

enum ImageOp {
  IMAGE_OP_UNSPECIFIED = 0;
  IMAGE_OP_RESIZE = 1;
  IMAGE_OP_CONVERT = 2;
  IMAGE_OP_COMPOSITE = 3;
}

enum ImageFormat {
  IMAGE_FORMAT_UNSPECIFIED = 0;
  IMAGE_FORMAT_JPEG = 1;
  IMAGE_FORMAT_PNG = 2;
}

enum ResizeMode {
  RESIZE_MODE_UNSPECIFIED = 0;
  RESIZE_MODE_FIT = 1;
  RESIZE_MODE_EXACT = 2;
  RESIZE_MODE_FILL = 3;
}

message ImageSpec {
  repeated InputSource inputs = 1;
  ImageOp op = 2;
  uint32 width = 3;
  uint32 height = 4;
  ResizeMode resize_mode = 5;
  ImageFormat format = 6;
}

message PackageSpec {
  InputSource input = 1;
  double segment_seconds = 2;
}

message BatchSpec {
  repeated OpSpec steps = 1;
  optional bool stop_on_failure = 2;
}

message GraphNode {
  string id = 1;
  OpSpec spec = 2;
}

message GraphSpec {
  repeated GraphNode nodes = 1;
}

message LadderSpec {
  InputSource input = 1;
  repeated OutputProfile rungs = 2;
  optional double segment_seconds = 3;
  optional double poster_seconds = 4;
}

message LoudnessTarget {
  double integrated_lufs = 1;
  double true_peak_db = 2;
}

message LoudnessSpec {
  InputSource input = 1;
  optional LoudnessTarget target = 2;
}

message GradeAdjustments {
  double brightness = 1;
  double contrast = 2;
  double saturation = 3;
  double gamma = 4;
}

enum ScopeMode {
  SCOPE_MODE_UNSPECIFIED = 0;
  SCOPE_MODE_FRAME = 1;
  SCOPE_MODE_WAVEFORM = 2;
  SCOPE_MODE_PARADE = 3;
  SCOPE_MODE_HISTOGRAM = 4;
  SCOPE_MODE_VECTORSCOPE = 5;
}

enum ScopeOutput {
  SCOPE_OUTPUT_UNSPECIFIED = 0;
  SCOPE_OUTPUT_IMAGE = 1;
  SCOPE_OUTPUT_DATA = 2;
}

message GradeScope {
  uint32 width = 1;
  uint32 height = 2;
  ScopeMode mode = 3;
  ScopeOutput output = 4;
  uint32 columns = 5;
  uint32 bins = 6;
}

message GradeSpec {
  InputSource input = 1;
  optional GradeAdjustments adjustments = 2;
  optional InputSource lookup_table = 3;
  optional GradeScope scope = 4;
}

message SubtitleSpec {
  InputSource input = 1;
  optional InputSource captions = 2;
  CaptionFormat format = 3;
  SubtitleMode mode = 4;
}

message TitleSpec {
  string text = 1;
  uint32 width = 2;
  uint32 height = 3;
  uint32 point_size = 4;
  string colour = 5;
  optional string background = 6;
  ImageFormat format = 7;
}

message AudioSpec {
  repeated InputSource inputs = 1;
  double gain_db = 2;
  uint64 fade_in_ticks = 3;
  uint64 fade_out_ticks = 4;
  optional uint32 high_pass_hz = 5;
  optional uint32 low_pass_hz = 6;
  optional double limiter_true_peak_db = 7;
}

message OpSpec {
  oneof op {
    ConcatSpec concat = 1;
    ProbeSpec probe = 2;
    TranscodeSpec transcode = 3;
    TrimSpec trim = 4;
    ThumbnailSpec thumbnail = 5;
    ImageSpec image = 6;
    PackageSpec package = 7;
    BatchSpec batch = 8;
    GraphSpec graph = 9;
    LadderSpec ladder = 10;
    LoudnessSpec loudness = 11;
    SubtitleSpec subtitle = 12;
    GradeSpec grade = 13;
    AudioSpec audio = 14;
    TitleSpec title = 15;
  }
}

message ConcatResult {
  MediaRef output = 1;
  double duration_seconds = 2;
}

message VideoStreamInfo {
  string codec = 1;
  uint32 width = 2;
  uint32 height = 3;
  double frame_rate = 4;
  int32 rotation = 5;
}

message AudioStreamInfo {
  string codec = 1;
  uint32 sample_rate = 2;
  uint32 channels = 3;
}

message ProbeResult {
  double duration_seconds = 1;
  uint32 video_streams = 2;
  uint32 audio_streams = 3;
  string container = 4;
  repeated VideoStreamInfo video = 5;
  repeated AudioStreamInfo audio = 6;
}

message TranscodeResult {
  MediaRef output = 1;
  VideoEncoder encoder = 2;
}

message TrimResult {
  MediaRef output = 1;
  double duration_seconds = 2;
}

message ThumbnailResult {
  repeated MediaRef outputs = 1;
}

message ImageResult {
  repeated MediaRef outputs = 1;
}

message PackageResult {
  MediaRef playlist = 1;
  repeated MediaRef segments = 2;
  optional MediaRef init_segment = 3;
}

message StepFailure {
  string code = 1;
  string message = 2;
  repeated FileError file_errors = 3;
}

message StepOutcome {
  uint32 position = 1;
  oneof outcome {
    OpResult result = 2;
    StepFailure failure = 3;
  }
}

message BatchResult {
  repeated StepOutcome steps = 1;
}

message NodeOutcome {
  string id = 1;
  oneof outcome {
    OpResult result = 2;
    StepFailure failure = 3;
  }
}

message GraphResult {
  repeated NodeOutcome nodes = 1;
}

message RenditionResult {
  OutputProfile profile = 1;
  MediaRef media = 2;
  optional MediaRef playlist = 3;
  repeated MediaRef segments = 4;
  double duration_seconds = 5;
  uint32 width = 6;
  uint32 height = 7;
  uint32 bandwidth_bps = 8;
  optional MediaRef init_segment = 9;
}

message LadderResult {
  optional MediaRef master_playlist = 1;
  repeated RenditionResult renditions = 2;
}

message LoudnessResult {
  optional MediaRef output = 1;
  double integrated_lufs = 2;
  double true_peak_db = 3;
  double loudness_range_lu = 4;
}

message ScopeData {
  ScopeMode mode = 1;
  uint32 components = 2;
  uint32 columns = 3;
  uint32 bins = 4;
  repeated uint32 counts = 5;
}

message GradeResult {
  MediaRef output = 1;
  optional MediaRef scope = 2;
  optional ScopeData data = 3;
}

message SubtitleResult {
  MediaRef output = 1;
}

message TitleResult {
  MediaRef output = 1;
}

message AudioResult {
  MediaRef output = 1;
  double duration_seconds = 2;
}

message OpResult {
  oneof op {
    ConcatResult concat = 1;
    ProbeResult probe = 2;
    TranscodeResult transcode = 3;
    TrimResult trim = 4;
    ThumbnailResult thumbnail = 5;
    ImageResult image = 6;
    PackageResult package = 7;
    BatchResult batch = 8;
    GraphResult graph = 9;
    LadderResult ladder = 10;
    LoudnessResult loudness = 11;
    SubtitleResult subtitle = 12;
    GradeResult grade = 13;
    AudioResult audio = 14;
    TitleResult title = 15;
  }
}
