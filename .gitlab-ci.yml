stages:
  - lint
  - test

image: rust:1.97

variables:
  CARGO_HOME: $CI_PROJECT_DIR/.cargo

cache:
  key: cargo
  paths:
    - .cargo
    - target

fmt:
  stage: lint
  script:
    - rustup component add rustfmt
    - cargo fmt --all --check

clippy:
  stage: lint
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
  script:
    - rustup component add clippy
    - cargo clippy --workspace --all-targets -- -D warnings

proto-lint:
  stage: lint
  image:
    name: bufbuild/buf:1.72.0
    entrypoint: [""]
  cache: []
  script:
    - buf lint

proto-breaking:
  stage: lint
  image:
    name: bufbuild/buf:1.72.0
    entrypoint: [""]
  cache: []
  script:
    - buf breaking --against "$CI_REPOSITORY_URL#branch=$CI_DEFAULT_BRANCH"
  rules:
    - if: $CI_COMMIT_BRANCH != $CI_DEFAULT_BRANCH

test:
  stage: test
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
  script:
    - cargo test --workspace

coverage:
  stage: test
  before_script:
    - apt-get update && apt-get install -y protobuf-compiler
  script:
    - rustup component add llvm-tools-preview
    - cargo install cargo-llvm-cov --locked
    - cargo llvm-cov --workspace --fail-under-lines 85
