services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: mm
      POSTGRES_PASSWORD: mm
      POSTGRES_DB: mm
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mm -d mm"]
      interval: 5s
      timeout: 3s
      retries: 12

  objectstore:
    image: chrislusf/seaweedfs:latest
    command: ["server", "-s3", "-dir=/data"]
    ports:
      - "127.0.0.1:8333:8333"
    volumes:
      - store-data:/data
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8333/"]
      interval: 5s
      timeout: 3s
      retries: 12

volumes:
  db-data:
  store-data:
