[workspace]
resolver = "3"
members = [
    "crates/mm-domain",
    "crates/mm-proto",
    "crates/mm-ffmpeg",
    "crates/mm-storage",
    "crates/mm-integration",
    "crates/mm-jobstore",
    "crates/mm-server",
    "crates/mm-worker",
    "crates/mmrpcd",
]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.97"

[workspace.dependencies]
uuid = { version = "1", features = ["v7"] }
thiserror = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
bytes = "1"
futures-core = "0.3"
futures-util = "0.3"
tokio = "1"
aws-config = "1"
aws-sdk-s3 = "1"
aws-smithy-types = { version = "1", features = ["http-body-1-x"] }
http-body = "1"
sync_wrapper = "1"
prost = "0.14"
tonic = "0.14"
tonic-prost = "0.14"
tonic-prost-build = "0.14"
proptest = "1"
